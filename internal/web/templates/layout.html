{{define "head"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="icon" href="/static/badge.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link rel="stylesheet" href="https://fonts.bunny.net/css?family=archivo-narrow:700|ibm-plex-sans:400,500,600|ibm-plex-mono:400,500">
  <link rel="stylesheet" href="/static/ledger.css">
  <script>
    try {
      var t = localStorage.getItem("ledger-theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="wrap{{if .Gate}} gate{{end}}">
{{end}}

{{define "mark"}}
<img class="badge" src="/static/badge.svg" width="32" height="32" alt="">
{{end}}

{{define "appearance"}}
<button type="button" class="theme-flip" id="theme-flip" aria-label="Appearance">
  <svg class="icon-sun" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
    <circle cx="8" cy="8" r="2.4" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
      d="M8 1.6v1.5M8 12.9v1.5M1.6 8h1.5M12.9 8h1.5M3.3 3.3l1.1 1.1M11.6 11.6l1.1 1.1M3.3 12.7l1.1-1.1M11.6 4.4l1.1-1.1"/>
  </svg>
  <svg class="icon-moon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
    <path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"
      d="M10.6 2.4A5.6 5.6 0 1 0 13.6 10 4.4 4.4 0 0 1 10.6 2.4z"/>
  </svg>
</button>
{{end}}

{{define "foot"}}
  {{if .HTMLLocked}}
  <p class="notice">
    {{if .User}}signed in as {{.User}} ·
    {{if .Operator}}<a href="/admin">admin</a> · {{end}}
    <button type="submit" form="logout">sign out</button>
    {{else}}{{if not .Gate}}<a href="/login">sign in</a>{{end}}{{end}}
  </p>
  {{if .User}}
  <form id="logout" class="logout" method="post" action="/logout">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
  </form>
  {{end}}
  {{end}}
  </div>
  <script src="/static/theme.js"></script>
</body>
</html>
{{end}}
