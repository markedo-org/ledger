name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Smoke
        run: ./scripts/smoke.sh
      - name: Dist
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          ./scripts/dist.sh
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ledger-darwin-arm64
            dist/ledger-linux-amd64
            dist/ledger-windows-amd64.exe
