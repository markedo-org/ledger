# Example nginx vhost. Replace ledger.example and the upstream port.
# TLS via certbot after DNS points here.

upstream ledger_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name ledger.example;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /mcp {
        proxy_pass http://ledger_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://ledger_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    client_max_body_size 2m;

    # The app sends the content headers itself. HSTS belongs here instead,
    # because only the proxy knows this name is served over TLS. Uncomment it
    # once every subdomain you want covered has a certificate: a long max-age
    # with includeSubDomains is hard to walk back.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
}
